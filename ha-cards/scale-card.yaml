# Eufy Smart Scale Dashboard Card for Home Assistant
# Requires: custom:button-card (install via HACS)
#
# Replicates the Eufy app UI with:
# - Hero: Weight (lb) big, BMI on the right
# - 3x4 grid of body composition metrics
# - "Weigh In" button at the bottom
#
# Theme: Oregon State Beaver Orange (#D73F09) on black, clean & simple.
# Copy this into your HA dashboard YAML editor.

type: grid
columns: 1
square: false
grid_options:
  columns: full
  rows: auto
cards:
  - type: heading
    heading: Body Composition
    heading_style: subtitle
  - type: custom:button-card
    entity: sensor.scale_monitor_weight_lb
    show_name: false
    show_icon: false
    show_state: false
    styles:
      card:
        - background: "linear-gradient(145deg, #2a2a2a, #1a1a1a)"
        - border-radius: 12px
        - padding: 20px
        - box-shadow: 0 2px 8px rgba(0,0,0,0.3)
      grid:
        - grid-template-areas: "\"hero\" \"row1\" \"row2\" \"row3\" \"row4\""
        - grid-template-rows: auto auto auto auto auto
    custom_fields:
      hero: |
        [[[
          const weight = states['sensor.scale_monitor_weight_lb'] ? parseFloat(states['sensor.scale_monitor_weight_lb'].state).toFixed(1) : '--';
          const bmi    = states['sensor.scale_monitor_bmi']       ? parseFloat(states['sensor.scale_monitor_bmi'].state).toFixed(1)       : '--';
          return `
            <div style="display:grid;grid-template-columns:2fr 1fr;align-items:center;padding:4px 4px 20px;border-bottom:1px solid #333;">
              <div style="text-align:left;">
                <div style="color:#888;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;">Weight</div>
                <div style="color:#D73F09;font-size:56px;font-weight:bold;line-height:1;">${weight}<span style="color:#888;font-size:22px;font-weight:normal;margin-left:8px;">lb</span></div>
              </div>
              <div style="text-align:right;">
                <div style="color:#888;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;">BMI</div>
                <div style="color:#fff;font-size:36px;font-weight:bold;line-height:1;">${bmi}</div>
              </div>
            </div>
          `;
        ]]]
      row1: |
        [[[
          const bfPct  = states['sensor.scale_monitor_body_fat']         ? parseFloat(states['sensor.scale_monitor_body_fat'].state).toFixed(1)         : '--';
          const bfMass = states['sensor.scale_monitor_body_fat_mass_lb'] ? parseFloat(states['sensor.scale_monitor_body_fat_mass_lb'].state).toFixed(1) : '--';
          const ffm    = states['sensor.scale_monitor_fat_free_mass_lb'] ? parseFloat(states['sensor.scale_monitor_fat_free_mass_lb'].state).toFixed(1) : '--';
          return `
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:12px 0;border-bottom:1px solid #333;">
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Body Fat</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${bfPct}<span style="color:#888;font-size:12px;font-weight:normal;">%</span></div>
              </div>
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Fat Mass</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${bfMass}<span style="color:#888;font-size:12px;font-weight:normal;"> lb</span></div>
              </div>
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Fat-Free</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${ffm}<span style="color:#888;font-size:12px;font-weight:normal;"> lb</span></div>
              </div>
            </div>
          `;
        ]]]
      row2: |
        [[[
          const smm    = states['sensor.scale_monitor_skeletal_muscle_mass_lb']  ? parseFloat(states['sensor.scale_monitor_skeletal_muscle_mass_lb'].state).toFixed(1)  : '--';
          const tbwLb  = states['sensor.scale_monitor_total_body_water_lb']      ? parseFloat(states['sensor.scale_monitor_total_body_water_lb'].state).toFixed(1)      : '--';
          const tbwPct = states['sensor.scale_monitor_total_body_water_percent'] ? parseFloat(states['sensor.scale_monitor_total_body_water_percent'].state).toFixed(1) : '--';
          return `
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:12px 0;border-bottom:1px solid #333;">
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Muscle</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${smm}<span style="color:#888;font-size:12px;font-weight:normal;"> lb</span></div>
              </div>
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Water</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${tbwLb}<span style="color:#888;font-size:12px;font-weight:normal;"> lb</span></div>
              </div>
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Water %</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${tbwPct}<span style="color:#888;font-size:12px;font-weight:normal;">%</span></div>
              </div>
            </div>
          `;
        ]]]
      row3: |
        [[[
          const vfi  = states['sensor.scale_monitor_visceral_fat_index'] ? parseFloat(states['sensor.scale_monitor_visceral_fat_index'].state).toFixed(0) : '--';
          const prot = states['sensor.scale_monitor_protein']            ? parseFloat(states['sensor.scale_monitor_protein'].state).toFixed(1)            : '--';
          const bmr  = states['sensor.scale_monitor_bmr']                ? parseFloat(states['sensor.scale_monitor_bmr'].state).toFixed(0)                : '--';
          return `
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:12px 0;border-bottom:1px solid #333;">
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Visceral</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${vfi}</div>
              </div>
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Protein</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${prot}<span style="color:#888;font-size:12px;font-weight:normal;">%</span></div>
              </div>
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">BMR</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${bmr}<span style="color:#888;font-size:12px;font-weight:normal;"> kcal</span></div>
              </div>
            </div>
          `;
        ]]]
      row4: |
        [[[
          const hr   = states['sensor.scale_monitor_heart_rate'] ? parseFloat(states['sensor.scale_monitor_heart_rate'].state).toFixed(0) : '--';
          const imp  = states['sensor.scale_monitor_impedance']  ? parseFloat(states['sensor.scale_monitor_impedance'].state).toFixed(0)  : '--';
          const wt   = states['sensor.scale_monitor_weight_lb']  ? states['sensor.scale_monitor_weight_lb'].last_changed : null;
          let ago = '--';
          if (wt) {
            const secs = Math.round((Date.now() - new Date(wt).getTime()) / 1000);
            if      (secs < 60)        ago = `${secs}s`;
            else if (secs < 3600)      ago = `${Math.floor(secs/60)}m`;
            else if (secs < 86400)     ago = `${Math.floor(secs/3600)}h`;
            else                       ago = `${Math.floor(secs/86400)}d`;
          }
          return `
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:12px 0 4px;">
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Heart Rate</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${hr}<span style="color:#888;font-size:12px;font-weight:normal;"> bpm</span></div>
              </div>
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Impedance</div>
                <div style="color:#D73F09;font-size:20px;font-weight:bold;">${imp}<span style="color:#888;font-size:12px;font-weight:normal;"> Ω</span></div>
              </div>
              <div>
                <div style="color:#888;font-size:11px;margin-bottom:3px;">Last</div>
                <div style="color:#fff;font-size:20px;font-weight:bold;">${ago}<span style="color:#888;font-size:12px;font-weight:normal;"> ago</span></div>
              </div>
            </div>
          `;
        ]]]
  - type: custom:button-card
    entity: button.scale_monitor_weigh_in
    name: Weigh In
    icon: mdi:scale-bathroom
    tap_action:
      action: call-service
      service: button.press
      service_data:
        entity_id: button.scale_monitor_weigh_in
    styles:
      card:
        - background: "linear-gradient(145deg, #D73F09, #A02E07)"
        - border-radius: 12px
        - padding: 16px
        - box-shadow: 0 2px 8px rgba(0,0,0,0.3)
        - border: none
      name:
        - color: "#fff"
        - font-size: 18px
        - font-weight: bold
        - letter-spacing: 1.5px
        - text-transform: uppercase
      icon:
        - color: "#fff"
        - width: 32px
