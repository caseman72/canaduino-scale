# Trigger-based template sensors that snapshot the PREVIOUS reading of each
# scale value whenever a new measurement arrives.
#
# Each sensor triggers on its own underlying entity, so `trigger.from_state`
# is the value that was on screen just before this measurement.
#
# HA only fires a state trigger when the value *changes*, so a metric that
# reads the same twice (e.g. Visceral Fat clamped at 20) would never update.
# The second trigger fires 35 s after each new weight (covers the firmware's
# 30 s HR grace window); if the metric didn't change during that weigh-in
# (last_changed older than the new weight), previous = the unchanged value.
#
# Install: paste this into configuration.yaml under `template:`, or
#   template: !include ha-cards/previous-readings.yaml
# Then restart HA.

- trigger:
    - platform: state
      entity_id: sensor.scale_monitor_weight_lb
      not_to: ["unknown", "unavailable", "none"]
      not_from: ["unknown", "unavailable", "none"]
  sensor:
    - name: "Scale Previous Weight lb"
      unique_id: scale_previous_weight_lb
      unit_of_measurement: lb
      state: "{{ trigger.from_state.state }}"

- trigger:
    - platform: state
      entity_id: sensor.scale_monitor_bmi
      not_to: ["unknown", "unavailable", "none"]
      not_from: ["unknown", "unavailable", "none"]
      id: changed
    - platform: state
      entity_id: sensor.scale_monitor_weight_lb
      not_to: ["unknown", "unavailable", "none"]
      not_from: ["unknown", "unavailable", "none"]
      for: "00:00:35"
      id: weigh_in
  sensor:
    - name: "Scale Previous BMI"
      unique_id: scale_previous_bmi
      state: >
        {% if trigger.id == 'changed' %}
          {{ trigger.from_state.state }}
        {% elif as_timestamp(states.sensor.scale_monitor_bmi.last_changed, 0) < as_timestamp(trigger.to_state.last_changed) - 5 %}
          {{ states('sensor.scale_monitor_bmi') }}
        {% else %}
          {{ this.state }}
        {% endif %}

