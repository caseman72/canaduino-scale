# Trigger-based template sensors that snapshot the PREVIOUS reading of each
# scale value whenever a new measurement arrives.
#
# Each sensor triggers on its own underlying entity, so `trigger.from_state`
# is the value that was on screen just before this measurement.
#
# Install: paste this into configuration.yaml under `template:`, or
#   template: !include ha-cards/previous-readings.yaml
# Then restart HA.

- trigger:
    - platform: state
      entity_id: sensor.scale_monitor_weight_lb
      not_to: ["unknown", "unavailable", "none"]
      not_from: ["unknown", "unavailable", "none"]
  sensor:
    - name: "Scale Previous Weight lb"
      unique_id: scale_previous_weight_lb
      unit_of_measurement: lb
      state: "{{ trigger.from_state.state }}"

